<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="夜のストレッチ">
<title>夜のストレッチルーティン</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap');

  :root{
    --bg:#1B1712;
    --ink:#EDE6DC;
    --ink-soft:#9C9184;
    --line: rgba(237,230,220,0.12);
    --c1:#8B5E4A; /* ポール */
    --c2:#7A8266; /* 呼吸 */
    --c3:#5B7078; /* 90/90 */
    --c4:#7A6478; /* 股関節・胸椎 */
    --c5:#A98A52; /* ジャーナル */
    --phase-color: var(--c1);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans JP', sans-serif;
    overscroll-behavior:none;
    -webkit-user-select:none; user-select:none;
  }
  #app{
    max-width:480px; margin:0 auto;
    min-height:100dvh;
    display:flex; flex-direction:column;
    padding: max(24px, env(safe-area-inset-top)) 22px max(24px, env(safe-area-inset-bottom));
    transition: background-color 1.2s ease;
  }

  .phase-track{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom: 30px;
  }
  .phase-dot{
    flex:1; text-align:center; position:relative;
    font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:.04em;
    color: var(--ink-soft);
    padding-bottom:10px;
    border-bottom: 2px solid var(--line);
    transition: border-color .6s, color .6s;
  }
  .phase-dot.active{ color: var(--phase-color); border-color: var(--phase-color); font-weight:600;}
  .phase-dot.done{ color: var(--ink); border-color: var(--ink-soft); }
  .phase-dot .num{ display:block; font-size:15px; margin-bottom:2px; }

  .screen{ flex:1; display:flex; flex-direction:column; }
  .hidden{ display:none !important; }

  h1{
    font-family:'Source Serif 4', serif;
    font-weight:600;
    font-size: 27px;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  .sub{ color:var(--ink-soft); font-size:14.5px; margin-bottom:32px; line-height:1.7; }

  .start-btn{
    margin-top:auto;
    width:100%;
    padding:19px;
    border:1.5px solid var(--ink);
    border-radius:14px;
    background: transparent;
    color: var(--ink);
    font-size:16px; font-weight:700;
    font-family:inherit;
    cursor:pointer;
  }

  .sound-setup-toggle{
    margin-top:14px;
    width:100%;
    padding:13px;
    border:1.5px dashed var(--line);
    border-radius:12px;
    background:transparent;
    color:var(--ink-soft);
    font-family:inherit;
    font-size:13.5px;
    cursor:pointer;
  }
  .sound-setup-toggle.on{ color:var(--ink); border-style:solid; border-color: var(--ink); }

  .run-screen{ flex:1; display:flex; flex-direction:column; align-items:center; }
  .phase-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:17px; letter-spacing:.06em;
    color: var(--phase-color);
    font-weight:700;
    margin-bottom:8px;
  }
  .exercise-name{
    font-family:'Source Serif 4', serif;
    font-weight:700;
    font-size: 40px;
    text-align:center;
    line-height:1.25;
    margin: 0 0 8px;
    min-height: 100px;
    display:flex; align-items:center; justify-content:center;
  }
  .exercise-note{
    color:var(--ink-soft); font-size:17px; text-align:center;
    line-height:1.6;
    min-height: 48px; padding:0 8px; margin-bottom:18px;
  }

  .timer-ring{
    position:relative;
    width:250px; height:250px;
    margin: 4px auto 22px;
  }
  .timer-ring svg{ transform:rotate(-90deg); width:100%; height:100%; }
  .ring-bg{ fill:none; stroke: var(--line); stroke-width:7; }
  .ring-fg{ fill:none; stroke: var(--phase-color); stroke-width:7; stroke-linecap:round; transition: stroke-dashoffset 1s linear, stroke .6s; }
  .timer-num{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:80px; font-weight:700;
    font-variant-numeric: tabular-nums;
  }

  .progress-line{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; color:var(--ink-soft);
    margin-bottom: 22px;
  }

  .controls{
    width:100%;
    display:flex; align-items:center; gap:12px;
    margin-top:auto;
  }
  .ctrl-btn{
    border:1.5px solid var(--line);
    background:transparent;
    border-radius:12px;
    padding:16px 0;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px; color:var(--ink);
    cursor:pointer;
    flex: 0 0 64px;
    text-align:center;
  }
  .play-btn{
    flex:1;
    border:1.5px solid var(--phase-color);
    border-radius:12px;
    background: transparent;
    color: var(--ink);
    padding:16px 0;
    font-size:16px; font-weight:700;
    font-family:inherit;
    cursor:pointer;
  }

  .footer-row{
    display:flex; justify-content:space-between;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; color:var(--ink-soft);
    margin-top:14px;
  }
  .sound-toggle{
    background:none; border:none; color:var(--ink-soft);
    font-family:inherit; font-size:11px; cursor:pointer;
    text-decoration:underline; padding:0;
  }

  .done-screen{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .done-screen h1{ font-size:27px; }
  .done-sub{ color:var(--ink-soft); font-size:15px; line-height:1.8; margin-bottom:10px; max-width:320px; }
  .done-stats{ font-family:'IBM Plex Mono', monospace; color:var(--ink-soft); font-size:13px; margin-bottom:36px;}
  .journal-icon{ font-size:40px; margin-bottom:18px; opacity:.8; }

  .glow{
    animation: glowfx 1.4s ease-out;
  }
  @keyframes glowfx{
    0%{ background-color: color-mix(in srgb, var(--phase-color) 22%, var(--bg)); }
    100%{ background-color: var(--bg); }
  }
</style>
</head>
<body>
<div id="app">

  <!-- SETUP SCREEN -->
  <div id="setupScreen" class="screen">
    <h1>夜のストレッチルーティン</h1>
    <div class="sub">ストレッチポール〜モビリティまで、順番通りに進みます。<br>終わったらそのままLifenoteへ。</div>
    <button class="sound-setup-toggle" id="soundSetupToggle">🔇 音声案内 OFF（タップでON）</button>
    <button class="start-btn" id="startBtn">始める</button>
  </div>

  <!-- RUN SCREEN -->
  <div id="runScreen" class="screen run-screen hidden">
    <div class="phase-track" id="phaseTrack"></div>

    <div class="phase-label" id="phaseLabel"></div>
    <div class="exercise-name" id="exerciseName"></div>
    <div class="exercise-note" id="exerciseNote"></div>

    <div class="timer-ring">
      <svg viewBox="0 0 100 100">
        <circle class="ring-bg" cx="50" cy="50" r="44"></circle>
        <circle class="ring-fg" id="ringFg" cx="50" cy="50" r="44"></circle>
      </svg>
      <div class="timer-num" id="timerNum"></div>
    </div>

    <div class="progress-line" id="progressLine"></div>

    <div class="controls">
      <button class="ctrl-btn" id="prevBtn">◀ 前へ</button>
      <button class="play-btn" id="playBtn">一時停止</button>
      <button class="ctrl-btn" id="nextBtn">次へ ▶</button>
    </div>
    <div class="footer-row">
      <span id="elapsedLabel">経過 0:00</span>
      <button class="sound-toggle" id="soundToggle">🔇 音声案内を鳴らす</button>
      <span id="remainLabel">残り 0:00</span>
    </div>
  </div>

  <!-- DONE SCREEN -->
  <div id="doneScreen" class="screen done-screen hidden">
    <div class="journal-icon">🌙</div>
    <h1>おつかれさまでした</h1>
    <div class="done-sub">このままLifenoteアプリを開いて、<br>短くてよいのでジャーナリングをどうぞ。</div>
    <div class="done-stats" id="doneStats"></div>
    <button class="start-btn" id="restartBtn" style="margin-top:0; width:auto; padding:14px 28px; border-radius:12px;">もう一度</button>
  </div>

</div>

<script>
(function(){
  const FLAT = [
    { phaseIdx:0, phaseName:'①ストレッチポール', color:'#8B5E4A', name:'ストレッチポール縦乗り', sec:120, note:'背骨に沿って縦に乗り、呼吸を落ち着ける' },

    { phaseIdx:1, phaseName:'②ピラティス呼吸', color:'#7A8266', name:'骨盤底→下腹部→リブケージ', sec:90, note:'吐き切って2〜3秒キープ。肩と首は脱力' },

    { phaseIdx:2, phaseName:'③90/90ストレッチ', color:'#5B7078', name:'90/90ストレッチ（右）', sec:60, note:'骨盤は床につけたまま、股関節をゆっくり倒す' },
    { phaseIdx:2, phaseName:'③90/90ストレッチ', color:'#5B7078', name:'90/90ストレッチ（左）', sec:60, note:'反対側も同様に' },

    { phaseIdx:3, phaseName:'④股関節・胸椎', color:'#7A6478', name:'仰向け骨盤ゆらゆら', sec:60, note:'膝を抱えたまま、骨盤を左右にゆっくり揺らす' },
    { phaseIdx:3, phaseName:'④股関節・胸椎', color:'#7A6478', name:'胸椎ツイスト（右）', sec:45, note:'肩は床につけたまま、抱えた膝を反対側へ倒す' },
    { phaseIdx:3, phaseName:'④股関節・胸椎', color:'#7A6478', name:'胸椎ツイスト（左）', sec:45, note:'反対側も同様に、腹圧はキープ' },
  ];
  const PHASE_NAMES = ['①ポール','②呼吸','③90/90','④モビリティ'];

  let current = 0;
  let remaining = FLAT[0].sec;
  let timerId = null;
  let running = false;
  let elapsedTotal = 0;
  let soundOn = false;
  try{ soundOn = localStorage.getItem('nightRoutineVoice') === 'on'; }catch(e){}
  let audioCtx = null;

  const setupScreen = document.getElementById('setupScreen');
  const runScreen = document.getElementById('runScreen');
  const doneScreen = document.getElementById('doneScreen');
  const ringFg = document.getElementById('ringFg');
  const R = 44;
  const CIRC = 2 * Math.PI * R;
  ringFg.style.strokeDasharray = CIRC;

  function renderPhaseTrack(){
    const track = document.getElementById('phaseTrack');
    track.innerHTML = '';
    PHASE_NAMES.forEach((name, i) => {
      const d = document.createElement('div');
      d.className = 'phase-dot';
      d.id = 'dot-' + i;
      d.innerHTML = '<span class="num">' + (i+1) + '</span>' + name;
      track.appendChild(d);
    });
  }

  function updatePhaseTrack(activeIdx){
    PHASE_NAMES.forEach((_, i) => {
      const d = document.getElementById('dot-' + i);
      d.classList.remove('active','done');
      if(i < activeIdx) d.classList.add('done');
      if(i === activeIdx) d.classList.add('active');
    });
  }

  function speak(text){
    if(!soundOn) return;
    try{
      if(!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const t = /[。、！？]$/.test(text) ? text : text + '。';
      const u = new SpeechSynthesisUtterance(t);
      u.lang = 'ja-JP';
      u.rate = 0.85;
      u.pitch = 1.0;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  function loadStep(idx){
    if(idx < 0) idx = 0;
    if(idx >= FLAT.length){ finish(); return; }
    current = idx;
    const step = FLAT[current];
    remaining = step.sec;
    document.documentElement.style.setProperty('--phase-color', step.color);
    document.getElementById('phaseLabel').textContent = step.phaseName;
    document.getElementById('exerciseName').textContent = step.name;
    document.getElementById('exerciseNote').textContent = step.note;
    document.getElementById('progressLine').textContent = (current+1) + ' / ' + FLAT.length;
    updatePhaseTrack(step.phaseIdx);
    updateRing();
    updateTimerLabel();
    updateFooter();
    speak(step.name);
  }

  function updateRing(){
    const step = FLAT[current];
    const frac = remaining / step.sec;
    ringFg.style.strokeDashoffset = CIRC * (1 - frac);
  }

  function updateTimerLabel(){
    const m = Math.floor(remaining / 60);
    const s = remaining % 60;
    document.getElementById('timerNum').textContent = m + ':' + (s < 10 ? '0' : '') + s;
  }

  function totalRemainingSec(){
    let sum = remaining;
    for(let i = current+1; i < FLAT.length; i++) sum += FLAT[i].sec;
    return sum;
  }

  function updateFooter(){
    const em = Math.floor(elapsedTotal/60), es = elapsedTotal%60;
    document.getElementById('elapsedLabel').textContent = '経過 ' + em + ':' + (es<10?'0':'') + es;
    const rem = totalRemainingSec();
    const rm = Math.floor(rem/60), rs = rem%60;
    document.getElementById('remainLabel').textContent = '残り ' + rm + ':' + (rs<10?'0':'') + rs;
  }

  function beep(){
    if(!soundOn) return;
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = 528;
      g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.12, audioCtx.currentTime + 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.6);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + 0.6);
    }catch(e){}
  }

  function glowScreen(){
    const app = document.getElementById('app');
    app.classList.remove('glow');
    void app.offsetWidth;
    app.classList.add('glow');
  }

  function tick(){
    if(timerId) clearInterval(timerId);
    timerId = setInterval(() => {
      if(!running) return;
      remaining -= 1;
      elapsedTotal += 1;
      if(remaining <= 0){
        beep();
        glowScreen();
        loadStep(current + 1);
      } else {
        updateRing();
        updateTimerLabel();
        updateFooter();
      }
    }, 1000);
  }

  function startPrep(onDone){
    let prepRemaining = 5;
    document.documentElement.style.setProperty('--phase-color', '#9C9184');
    document.getElementById('phaseLabel').textContent = '準備';
    document.getElementById('exerciseName').textContent = 'まもなく開始';
    document.getElementById('exerciseNote').textContent = '楽な姿勢になってください';
    document.getElementById('progressLine').textContent = '';
    updatePhaseTrack(-1);
    speak('まもなく開始します');
    function renderPrep(){
      const frac = prepRemaining / 5;
      ringFg.style.strokeDashoffset = CIRC * (1 - frac);
      document.getElementById('timerNum').textContent = prepRemaining;
    }
    renderPrep();
    const prepTimer = setInterval(() => {
      prepRemaining -= 1;
      if(prepRemaining <= 0){
        clearInterval(prepTimer);
        beep();
        glowScreen();
        onDone();
      } else {
        renderPrep();
      }
    }, 1000);
  }

  let wakeLock = null;
  async function requestWakeLock(){
    try{
      if('wakeLock' in navigator){
        wakeLock = await navigator.wakeLock.request('screen');
      }
    }catch(e){ wakeLock = null; }
  }
  function releaseWakeLock(){
    if(wakeLock){
      wakeLock.release().catch(()=>{});
      wakeLock = null;
    }
  }
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible' && running){
      requestWakeLock();
    }
  });

  document.getElementById('startBtn').addEventListener('click', () => {
    elapsedTotal = 0;
    running = true;
    requestWakeLock();
    setupScreen.classList.add('hidden');
    runScreen.classList.remove('hidden');
    renderPhaseTrack();
    startPrep(() => {
      loadStep(0);
      tick();
    });
  });

  document.getElementById('playBtn').addEventListener('click', () => {
    running = !running;
    document.getElementById('playBtn').textContent = running ? '一時停止' : '再開';
  });
  document.getElementById('nextBtn').addEventListener('click', () => { loadStep(current + 1); });
  document.getElementById('prevBtn').addEventListener('click', () => { loadStep(current - 1); });

  function syncSoundUI(){
    const setupEl = document.getElementById('soundSetupToggle');
    const runEl = document.getElementById('soundToggle');
    if(setupEl){
      setupEl.textContent = soundOn ? '🔊 音声案内 ON（タップでOFF）' : '🔇 音声案内 OFF（タップでON）';
      setupEl.classList.toggle('on', soundOn);
    }
    if(runEl){
      runEl.textContent = soundOn ? '🔊 音声案内を鳴らす' : '🔇 音声案内を鳴らす';
    }
  }

  function setSoundOn(v){
    soundOn = v;
    try{ localStorage.setItem('nightRoutineVoice', v ? 'on' : 'off'); }catch(e){}
    if(soundOn && !audioCtx){
      try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
    }
    if(soundOn){
      speak('音声案内をオンにしました');
    }
    syncSoundUI();
  }

  document.getElementById('soundSetupToggle').addEventListener('click', () => setSoundOn(!soundOn));
  document.getElementById('soundToggle').addEventListener('click', () => setSoundOn(!soundOn));
  syncSoundUI();

  function finish(){
    clearInterval(timerId);
    running = false;
    releaseWakeLock();
    runScreen.classList.add('hidden');
    doneScreen.classList.remove('hidden');
    const m = Math.floor(elapsedTotal/60), s = elapsedTotal%60;
    document.getElementById('doneStats').textContent = 'ストレッチ時間　' + m + '分' + s + '秒';
  }

  document.getElementById('restartBtn').addEventListener('click', () => {
    doneScreen.classList.add('hidden');
    setupScreen.classList.remove('hidden');
  });

})();
</script>
</body>
</html>
